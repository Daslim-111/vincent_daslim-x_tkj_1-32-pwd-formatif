
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>

    <style>
        * {
            box-sizing: border-box;
        }

        /* Pengaturan halaman */
        body {
            margin: 0;
            background-color: aliceblue;
            font-family: Arial, sans-serif;
        }

        /* Kartu proyek */
        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid cornsilk;
            margin: 30px auto;
            background-color: white;
        }

        /* Gambar kartu */
        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
        }

        .card h3 {
            color: black;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
            line-height: 1.5;
        }

        .card a {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <main>
        <div class="card">

            <img src=""
                 alt="Gambar proyek">

            <h3>Proyek Website Pribadi</h3>

            <p>
                Proyek ini adalah tugas untuk membuat website sederhana 
                menggunakan HTML dan CSS murni dan juga merupakan tugas 
                proyek akhir semester yang akan dibublish digithub dan 
                dikerjakan sesuai dengan perintah guru.
            </p>

            <a href="/pages/galery.html">Lihat Proyek</a>

        </div>
    </main>

    <footer style="text-align: center; padding: 20px;">
        <a href="/index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
