<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tombol</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: azure;
            text-align: left;
            padding: 40px;
        }

        h2{
            font-size: 20px;
            color: grey;
        }

        .btn{
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 10px;
            margin-bottom: 10px;
        }

        .btn-primary{
            background-color: blue;
            color: white;
            border: 2px solid;
        }

        .btn-secondary{
            background-color: whitesmoke;
            border: 2px solid;
        }

        .btn-outline{
            background-color: white;
            border: 2px solid black;
        }

        .btn-send{
            background-color: rgb(40, 160, 100);
            color: white;
            border: 2px solid;
        }
        .btn-secondary.btn-outline{
            color: black;
        }

        .btn-primary:hover{
            background-color: navy;
        }

        .btn-secondary:hover{
            background-color: gray;
        }

        .btn-outline:hover{
            background-color: rgba(0, 0, 0, 1);
        }

        .btn-send:hover{
            background-color: darkgreen;
        }
