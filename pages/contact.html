
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak</title>

    <style>
        body {
            margin: 0;
            background-color: azure;
            font-family: Arial, sans-serif;
        }

        #contact {
            padding: 40px 20px;
        }

        .contact-form {
            width: 400px;
            max-width: 100%;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #cccccc;
            border-radius: 10px;
            background-color: white;
            box-sizing: border-box;
        }

        .contact-form h2 {
            text-align: center;
            color: black;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-family: Arial, sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            background-color: #eff6ff;
            border-color: #2563eb;
            outline: none;
        }

        .btn-submit {
            background-color: rgb(37, 99, 235);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: rgb(30, 64, 175);
        }
    </style>
</head>

<body>

    <main>
        <section id="contact">

            <form class="contact-form">

                <h2>Hubungi Saya</h2>

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan nama kamu"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Masukkan email kamu"
                        required>
                </div>

                <div class="form-group">
                    <label for="pesan">Pesan</label>
                    <textarea
                        id="pesan"
                        name="pesan"
                        rows="10"
                        placeholder="Tuliskan pesan kamu"
                        required></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    Kirim Pesan
                </button>

            </form>

        </section>
    </main>

    <footer style="text-align: center; padding: 20px;">
        <a href="/index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
